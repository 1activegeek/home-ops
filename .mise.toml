[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
# The age key lives at the XDG path that .sops.yaml already declares as key_file,
# not at the upstream template's repo-root ./age.key (which is gitignored and has
# never existed in this checkout). The old value made `task talos:generate-config`
# and `task bootstrap:*` fail their `test -f` preconditions before running.
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/home-ops.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
python = "3.14.7"
yamllint = "1.38.0"
"pipx:makejinja" = "2.8.3"
"pipx:flux-local" = "8.4.0"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cli/cli" = "2.101.0"
"aqua:cloudflare/cloudflared" = "2026.9.1"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.53.1"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubectl" = "1.34.0"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:siderolabs/talos" = "1.13.9"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:pre-commit/pre-commit" = "4.6.2"
