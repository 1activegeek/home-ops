---
# SABnzbd on the Synology (Container Manager -> Project).
#
# Why here and not in the cluster: SABnzbd's working set is the single most
# IO-heavy thing in the media pipeline. On the NAS it writes to local disk, so
# par2 repair and unpack never cross the 1GbE link, the final move into the
# library is a rename rather than a copy, and the entire class of "halt if remote
# storage disconnects" problem disappears instead of needing to be solved.
#
# The cluster reaches this through a selectorless Service + EndpointSlice in the
# media namespace (kubernetes/apps/media/sabnzbd/app/service.yaml), so the *arr*s
# use sabnzbd.media.svc.cluster.local:8080 and never an IP.
#
# Renovate tracks the image tag in this file via its docker-compose manager.
#
# SETUP (one time, in Container Manager):
#   1. Create the config folder on the NAS: /volume1/docker/sabnzbd
#   2. Create a Project pointing at this file.
#   3. Fill in the two values below from 1Password (vault: homeops, item: sabnzbd)
#      - SABNZBD__API_KEY  <- field  api_key
#      - SABNZBD__NZB_KEY  <- field  nzb_key
#      These MUST match 1Password: the *arr*s are already staged with that API key,
#      and the config automation authenticates with it.
#   4. Start the project. Everything else is applied over the API by
#      ./scripts/sabnzbd-apply-config.sh - do not hand-configure it.

services:
  sabnzbd:
    image: ghcr.io/home-operations/sabnzbd:5.1.3
    container_name: sabnzbd
    restart: unless-stopped
    # 1027:100 matches ownership on /volume1/media. The *arr*s import over NFS as
    # the same uid/gid, so anything SABnzbd writes they can move, hardlink and
    # delete. Getting this wrong is the main way this setup breaks.
    environment:
      TZ: America/New_York
      SABNZBD__API_KEY: "REPLACE_FROM_1PASSWORD_sabnzbd_api_key"
      SABNZBD__NZB_KEY: "REPLACE_FROM_1PASSWORD_sabnzbd_nzb_key"
      SABNZBD__HOST_WHITELIST_ENTRIES: >-
        sabnzbd,
        sabnzbd.media,
        sabnzbd.media.svc,
        sabnzbd.media.svc.cluster,
        sabnzbd.media.svc.cluster.local,
        sabnzbd.thegeekybits.com,
        atlantis.server.mix.net
    user: "1027:100"
    ports:
      # 10007 is NZBGet; SABnzbd takes 10008 so both can run in parallel until cutover.
      - "10008:8080"
    volumes:
      - /volume1/docker/sabnzbd:/config
      # Mounted at /data/media on purpose, so SABnzbd reports exactly the paths the
      # *arr*s already see over NFS. That is what makes remote path mappings
      # unnecessary - the thing that has been quietly wrong in the NZBGet setup.
      - /volume1/media:/data/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api?mode=version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
