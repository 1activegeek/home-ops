---
# Keeps sabnzbd.${SECRET_DOMAIN} working with cert-manager TLS even though the app
# itself runs on the Synology. Direct access stays available at the NAS's own DNS
# name on port 10008 for when the cluster is down.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd
spec:
  hostnames: ["sabnzbd.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: sabnzbd
          port: 8080
