---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./cronjob-export.yaml
  - ./cronjob-rollup.yaml

# Stdlib Python (plus duckdb for the rollup) mounted into a stock python image,
# so there is no image to build. The hash suffix rolls the CronJobs onto a new
# ConfigMap whenever a script changes.
configMapGenerator:
  - name: ha-archive-scripts
    files:
      - export.py
      - rollup.py
