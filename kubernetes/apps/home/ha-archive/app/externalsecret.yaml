---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-archive
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: ha-archive-secret
    template:
      data:
        # HA long-lived token "ha-archive (home-ops CronJob)", read-only use.
        HA_TOKEN: "{{ .ha_token }}"
  dataFrom:
    - extract:
        key: ha-archive
