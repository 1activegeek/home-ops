---
# External HTTPRoute for Home Assistant
# Protected by gateway-level Authentik forward-auth (default)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-external
  annotations:
    # Same hostname as the internal `home-assistant` route. In-cluster split DNS
    # resolves it to envoy-internal, so a Gatus probe here would just repeat
    # that check; external reachability needs an out-of-cluster probe.
    gatus.home-operations.com/enabled: "false"
  namespace: home
spec:
  hostnames:
    - hass.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: home-assistant-app
          port: 8123
