---
# External HTTPRoute for Home Assistant
# Protected by gateway-level Authentik forward-auth (default)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-external
  annotations:
    # Outside-in twin of the internal `home-assistant` check: the envoy-external
    # Gatus default resolves through public DNS, so this one goes via
    # Cloudflare and the tunnel.
    gatus.home-operations.com/endpoint: |
      name: Home Assistant (external)
  namespace: home
spec:
  hostnames:
    - hass.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: home-assistant-app
          port: 8123
