---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        # TEMPORARY WORKAROUND (2026-07-26) — remove once awscrt ships a fix.
        #
        # The HA image ships awscrt 0.32.1 (pre-installed for the core lg_thinq
        # integration). At runtime the ha_hatch custom component installs
        # hatch_rest_api==1.34.1, whose unpinned awsiotsdk>=1.16.0 resolves to
        # 1.31.0 and pins awscrt==0.36.1 — upgrading awscrt on disk mid-boot.
        # awscrt.io is already imported at 0.32.1, whose ClientTlsContext.__slots__
        # has no '_certificate_source', while awscrt.aws_iot_metrics (a module that
        # only exists in 0.36.x) then imports fresh from 0.36.1 and reads that
        # attribute -> AttributeError every coordinator poll (~80s), which both
        # floods the log and leaves all Hatch entities dead.
        #
        # Fix: seed a persistent, self-consistent awscrt 0.36.1 under /config/pydeps
        # and put it first on sys.path via PYTHONPATH, so every awscrt submodule
        # resolves from one install regardless of what HA does to site-packages.
        initContainers:
          awscrt-pin:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.5.4
            command:
              - sh
              - -c
              - pip install --quiet --upgrade --target /config/pydeps "awsiotsdk==1.31.0"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.5.4
            env:
              TZ: America/New_York
              # See the awscrt-pin initContainer above.
              PYTHONPATH: /config/pydeps
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 60
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 10
                  periodSeconds: 10
            securityContext:
              privileged: true  # Required for AlarmDecoder USB serial access
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.121.0
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "8081"
              - /config
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      hostNetwork: true
      securityContext:
        runAsUser: 0 # HA needs root for some integrations
        runAsGroup: 0
        fsGroup: 0
      nodeSelector:
        kubernetes.io/hostname: asgard-mpc-01

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
      code-server:
        controller: home-assistant
        ports:
          http:
            port: 8081

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 25Gi
        globalMounts:
          - path: /config
      alarmdecoder-usb:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1018WZB-if00-port0
        globalMounts:
          - path: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1018WZB-if00-port0

    route:
      app:
        hostnames: ["hass.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8123
      code-server:
        hostnames: ["hass-code.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: code-server
                port: 8081
