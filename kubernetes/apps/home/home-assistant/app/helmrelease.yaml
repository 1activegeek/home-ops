---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
          # Heartbeat to Healthchecks (monitoring/healthchecks heartbeat runner).
          healthchecks.io/slug: home-assistant
          healthchecks.io/url: http://home-assistant-app.home.svc.cluster.local:8123/manifest.json
          # code-server gets its own check (container readiness; see its probe).
          healthchecks.io/containers: code-server=ha-code-server
        # TEMPORARY WORKAROUND (2026-07-26) — remove once awscrt ships a fix.
        #
        # The HA image ships awscrt 0.32.1 (pre-installed for the core lg_thinq
        # integration). At runtime the ha_hatch custom component installs
        # hatch_rest_api==1.34.1, whose unpinned awsiotsdk>=1.16.0 resolves to
        # 1.31.0 and pins awscrt==0.36.1 — upgrading awscrt on disk mid-boot.
        # awscrt.io is already imported at 0.32.1, whose ClientTlsContext.__slots__
        # has no '_certificate_source', while awscrt.aws_iot_metrics (a module that
        # only exists in 0.36.x) then imports fresh from 0.36.1 and reads that
        # attribute -> AttributeError every coordinator poll (~80s), which both
        # floods the log and leaves all Hatch entities dead.
        #
        # Fix: seed a persistent, self-consistent awscrt 0.36.1 under /config/pydeps
        # and put it first on sys.path via PYTHONPATH, so every awscrt submodule
        # resolves from one install regardless of what HA does to site-packages.
        initContainers:
          awscrt-pin:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.9.3
            command:
              - sh
              - -c
              - pip install --quiet --upgrade --target /config/pydeps "awsiotsdk==1.31.0"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.9.3
            env:
              TZ: America/New_York
              # See the awscrt-pin initContainer above.
              PYTHONPATH: /config/pydeps
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 60
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 10
                  periodSeconds: 10
            securityContext:
              privileged: true  # Required for AlarmDecoder USB serial access
            # Steady state is 1.0-1.3GiB; a frontend reconnect storm OOM-killed
            # the pod at the old 2Gi limit on 2026-09-24.
            resources:
              requests:
                cpu: 100m
                memory: 1280Mi
              limits:
                memory: 3Gi
          # Config editor, reachable ONLY through the Home Assistant UI.
          #
          # The pod is hostNetwork, so whatever code-server binds is bound on the
          # node. It listens on loopback only and has no Service or HTTPRoute:
          # nothing on the LAN or in the cluster can reach it. Home Assistant
          # (same network namespace) proxies it into an admin-only sidebar panel
          # via the hass_ingress custom integration (work_mode: ingress), so the
          # only way in is an authenticated HA session. --auth none is safe only
          # because of the loopback bind; never add a route or Service for it.
          # Break-glass: kubectl -n home port-forward pod/home-assistant-0 8081
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1
            args:
              - --auth
              - none
              - --bind-addr
              - 127.0.0.1:8081
              - --disable-telemetry
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - /config
            # Liveness, not readiness: a readiness failure here would mark the
            # whole pod NotReady and pull Home Assistant out of its Service.
            # A hung editor gets restarted instead, and a crash loop shows up
            # as not ready on the ha-code-server heartbeat. The kubelet shares
            # the node's network namespace (hostNetwork), so it can reach the
            # loopback bind.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    host: 127.0.0.1
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      hostNetwork: true
      securityContext:
        runAsUser: 0 # HA needs root for some integrations
        runAsGroup: 0
        fsGroup: 0
      nodeSelector:
        kubernetes.io/hostname: asgard-mpc-01

    service:
      app:
        controller: home-assistant
        # Pin the name: with a single Service bjw-s would rename it to
        # "home-assistant", breaking the external route and heartbeat URL.
        forceRename: home-assistant-app
        ports:
          http:
            port: 8123

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 25Gi
        globalMounts:
          - path: /config
      alarmdecoder-usb:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1018WZB-if00-port0
        globalMounts:
          - path: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1018WZB-if00-port0
      # Short-lived token for the "Shut down cluster" button (HA plan ha-17).
      # Mounted into the HA container only, not code-server. Its RBAC allows
      # nothing but starting the pinned Job in kubernetes/apps/cluster-shutdown.
      cluster-shutdown-token:
        type: custom
        volumeSpec:
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        advancedMounts:
          home-assistant:
            app:
              - path: /var/run/secrets/home-ops/cluster-shutdown
                readOnly: true

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: Home Assistant
            extra-labels:
              severity: critical
        hostnames: ["hass.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8123
