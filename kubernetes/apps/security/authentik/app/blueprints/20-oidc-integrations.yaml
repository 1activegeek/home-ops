# OIDC providers and their applications.
#
# client_id is pinned literally: several consumers hardcode it (kube-apiserver's oidc-client-id for
# headlamp, MAS's upstream provider for matrix, the hermes dotenv), so it has to survive a rebuild
# byte-for-byte.
#
# client_secret comes from !Env, backed by the authentik-oidc-clients ExternalSecret which reads each
# app's existing 1Password item. That is what makes a from-scratch rebuild work: authentik comes back
# with the same secret the app is already configured with, instead of generating a fresh one.
#
# matrix uses sub_mode: user_username because MAS maps the localpart from preferred_username, and its
# redirect URI embeds a pinned upstream-provider ULID that must match byte-for-byte. Its RS256 signing
# key must stay RSA — MAS and Synapse reject ECC.
#
# headlamp needs offline_access (it hard-fails without a refresh token) and the custom
# headlamp-email-verified scope from 00-foundation.yaml.

version: 1

metadata:
  name: homeops-oidc-integrations

entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homeops-foundation
      required: true
  - id: provider-headlamp
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: headlamp
    attrs:
      access_code_validity: minutes=1
      access_token_validity: hours=1
      authentication_flow: null
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_id: WxrKDa2ZRlFrT52GxJVz6wJuQxRSDw7RIAicrGP9
      client_secret: !Env 'AUTHENTIK_OIDC_HEADLAMP_SECRET'
      client_type: confidential
      encryption_key: null
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      jwt_federation_providers: []
      jwt_federation_sources: []
      logout_method: backchannel
      logout_uri: ''
      name: headlamp
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, headlamp-email-verified]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://headlamp.${SECRET_DOMAIN}/oidc-callback
      refresh_token_threshold: seconds=0
      refresh_token_validity: days=30
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_email
  - model: authentik_core.application
    identifiers:
      slug: headlamp
    attrs:
      backchannel_providers: []
      group: ''
      meta_description: ''
      meta_hide: false
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/headlamp.png
      meta_launch_url: https://headlamp.${SECRET_DOMAIN}
      meta_publisher: ''
      name: Headlamp
      open_in_new_tab: false
      policy_engine_mode: any
      provider: !KeyOf 'provider-headlamp'
      slug: headlamp
