# Application tiles with no provider attached.
#
# These exist purely so the authentik user portal at /if/user lists every service with the right icon
# and launch URL. They carry no authentication of their own — the apps behind them are either
# internal-only or authenticate some other way.
#
# Without this file a rebuilt instance comes back with an empty portal, which is why they are
# captured even though they are not integrations.

version: 1

metadata:
  name: homeops-launcher-apps

entries:
  - model: authentik_core.application
    identifiers:
      slug: alertmanager
    attrs:
      backchannel_providers: []
      group: ''
      meta_description: ''
      meta_hide: false
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/alertmanager.png
      meta_launch_url: https://alertmanager.${SECRET_DOMAIN}
      meta_publisher: ''
      name: Alertmanager
      open_in_new_tab: false
      policy_engine_mode: any
      provider: null
      slug: alertmanager
