  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      config:
        authentik_host: https://auth.${SECRET_DOMAIN}
        authentik_host_browser: https://auth.${SECRET_DOMAIN}
        authentik_host_insecure: false
        container_image: null
        docker_labels: null
        docker_map_ports: true
        docker_network: null
        kubernetes_disabled_components: []
        kubernetes_image_pull_secrets: []
        kubernetes_ingress_annotations: {}
        kubernetes_ingress_class_name: null
        kubernetes_ingress_secret_name: authentik-outpost-tls
        kubernetes_namespace: security
        kubernetes_replicas: 1
        kubernetes_service_type: ClusterIP
        log_level: info
        object_naming_template: ak-outpost-%(name)s
        refresh_interval: minutes=5
      name: authentik Embedded Outpost
      service_connection: null
      type: proxy
      providers:
        - !KeyOf 'provider-home-assistant'
        - !KeyOf 'provider-code-server'
        - !KeyOf 'provider-zwave-js-ui'
        - !KeyOf 'provider-zipline'
        - !KeyOf 'provider-esphome'
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf 'app-home-assistant'
      policy: !Find [authentik_policies.policy, [name, allow-authenticated-users]]
      order: 0
    attrs:
      enabled: true
      failure_result: false
      group: null
      negate: false
      timeout: 30
      user: null
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf 'app-code-server'
      policy: !Find [authentik_policies.policy, [name, allow-authenticated-users]]
