# Forward-auth (proxy) providers, their applications, and embedded-outpost membership.
#
# These back the gateway-level ext_authz SecurityPolicy on the envoy-external Gateway, which sends
# every external route to the embedded outpost at /outpost.goauthentik.io/auth/envoy. Apps opt OUT
# via the public-access component rather than opting in.
#
# client_secret is intentionally omitted: for a proxy provider it is only used between the embedded
# outpost and authentik itself, so a generated value is correct and nothing external depends on it.
#
# The outpost entry patches the built-in embedded outpost in place, keyed on its managed identifier.
# Listing `providers` here is authoritative — a provider missing from this list is removed from the
# outpost.

version: 1

metadata:
  name: homeops-proxy-integrations

entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homeops-foundation
      required: true
  - id: provider-home-assistant
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: home-assistant-proxy
    attrs:
      access_token_validity: hours=1
      authentication_flow: null
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      basic_auth_enabled: false
      basic_auth_password_attribute: ''
      basic_auth_user_attribute: ''
      certificate: null
      cookie_domain: ${SECRET_DOMAIN}
      external_host: https://hass.${SECRET_DOMAIN}
      intercept_header_auth: true
      internal_host: ''
      internal_host_ssl_validation: true
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      jwt_federation_providers: []
      jwt_federation_sources: []
      mode: forward_single
      name: home-assistant-proxy
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      refresh_token_validity: days=30
      skip_path_regex: ''
  - id: app-home-assistant
    model: authentik_core.application
    identifiers:
      slug: home-assistant
    attrs:
      backchannel_providers: []
      group: ''
      meta_description: ''
      meta_hide: false
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/home-assistant.png
      meta_launch_url: https://hass.${SECRET_DOMAIN}
      meta_publisher: ''
      name: Home Assistant
      open_in_new_tab: false
      policy_engine_mode: any
      provider: !KeyOf 'provider-home-assistant'
      slug: home-assistant
