---
# OIDC client secrets, projected into the authentik pods as environment variables so the blueprints
# in ./blueprints can pin them with !Env.
#
# This is what makes a from-scratch rebuild work. Without it authentik generates a fresh random
# secret per provider on first boot, which would not match what each application already reads from
# 1Password - every integration would break until the secrets were copied across by hand.
#
# Nothing is duplicated in 1Password: each entry points at the same item and field the application
# itself consumes, so there is still exactly one source of truth per secret. Field names are
# inconsistent across items (forgejo uses client_secret, mas uses authentik_client_secret) because
# they predate the convention; the mapping is normalised here rather than in the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-oidc-clients
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: authentik-oidc-clients
    template:
      data:
        AUTHENTIK_OIDC_GRAFANA_SECRET: "{{ .grafana }}"
        AUTHENTIK_OIDC_HEADLAMP_SECRET: "{{ .headlamp }}"
        AUTHENTIK_OIDC_HERMES_SECRET: "{{ .hermes }}"
        AUTHENTIK_OIDC_MATRIX_SECRET: "{{ .matrix }}"
        AUTHENTIK_OIDC_FORGEJO_SECRET: "{{ .forgejo }}"
  data:
    - secretKey: grafana
      remoteRef:
        key: grafana
        property: oidc_client_secret
    - secretKey: headlamp
      remoteRef:
        key: headlamp
        property: oidc_client_secret
    - secretKey: hermes
      remoteRef:
        key: hermes-dotenv
        property: oidc_client_secret
    - secretKey: matrix
      remoteRef:
        key: mas
        property: authentik_client_secret
    - secretKey: forgejo
      remoteRef:
        key: forgejo
        property: client_secret
