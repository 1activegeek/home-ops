---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - externalsecret.yaml
  - externalsecret-oidc.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - httproute-external.yaml
  - httproutefilter-deny-console.yaml
  - referencegrant.yaml

# Authentik config-as-code. Every object we own is declared in ./blueprints so the instance can be
# rebuilt from nothing. Mounted into the authentik pods via helmrelease values.blueprints.configMaps.
# disableNameSuffixHash keeps the name stable so the Helm value can reference it;
# reloader (annotation on the deployments) restarts pods when the content changes.
#
# The numeric prefixes are for humans - authentik discovers blueprints with rglob() and applies them
# in no particular order. Real ordering is enforced inside the files with metaapplyblueprint.
configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/00-foundation.yaml
      - blueprints/10-auth-experience.yaml
      - blueprints/20-oidc-integrations.yaml
      - blueprints/30-proxy-integrations.yaml
      - blueprints/40-launcher-apps.yaml
      - blueprints/99-cleanup.yaml

generatorOptions:
  disableNameSuffixHash: true

components:
  - ../../../../components/public-access

replacements:
  # Wire up the public-access SecurityPolicy to target authentik-external HTTPRoute
  - source:
      kind: HTTPRoute
      name: authentik-external
      fieldPath: metadata.name
    targets:
      - select:
          kind: SecurityPolicy
        fieldPaths:
          - spec.targetRefs.0.name
          - metadata.name
        options:
          delimiter: '-'
          index: 0
