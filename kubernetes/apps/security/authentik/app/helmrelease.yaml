---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chart:
    spec:
      chart: authentik
      version: 2026.8.3
      sourceRef:
        kind: HelmRepository
        name: authentik
  interval: 1h
  timeout: 15m
  valuesFrom:
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_SECRET_KEY
      targetPath: authentik.secret_key
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_DB_PASSWORD
      targetPath: authentik.postgresql.password
    - kind: Secret
      name: authentik-secret
      valuesKey: AUTHENTIK_DB_PASSWORD
      targetPath: postgresql.auth.password
    - kind: Secret
      name: authentik-secret
      valuesKey: SMTP_USERNAME
      targetPath: authentik.email.username
    - kind: Secret
      name: authentik-secret
      valuesKey: SMTP_PASSWORD
      targetPath: authentik.email.password
    - kind: Secret
      name: authentik-secret
      valuesKey: SMTP_FROM
      targetPath: authentik.email.from
    # - kind: Secret
    #   name: authentik-secret
    #   valuesKey: AUTHENTIK_DB_PASSWORD
    #   targetPath: postgresql.auth.postgresPassword
  values:
    # Config-as-code blueprints - the full authentik configuration lives here.
    # ConfigMap generated by kustomization.yaml; only *.yaml keys are applied.
    # The authentik worker auto-discovers and applies them on start/reconcile.
    blueprints:
      configMaps:
        - authentik-blueprints
      secrets: []

    # Authentik Global Configurations
    global:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      # OIDC client secrets, consumed by the blueprints via !Env. Applies to server and worker;
      # the worker is the one that actually applies blueprints, so it needs these present.
      envFrom:
        - secretRef:
            name: authentik-oidc-clients

    # Authentik Core Configuration
    authentik:
      log_level: info
      email:
        host: "smtp.mail.me.com" #remediate
        port: 587
        use_tls: true
        use_ssl: false
        timeout: 30

    # Authentik Server Configuration
    server:
      replicas: 1
      annotations:
        reloader.stakater.com/auto: "true"
      # Heartbeat to Healthchecks (monitoring/healthchecks heartbeat runner).
      deploymentAnnotations:
        healthchecks.io/slug: authentik-server
        healthchecks.io/url: http://authentik-server.security.svc.cluster.local/-/health/ready/
      route:
        main:
          enabled: true
          annotations:
            # The IdP: every SSO and forward-auth app fails with it.
            gatus.home-operations.com/endpoint: |
              extra-labels:
                severity: critical
          hostnames:
            - auth.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          https: true

    # Authentik Worker Configuration
    worker:
      replicas: 1
      annotations:
        reloader.stakater.com/auto: "true"
      # Readiness only: the worker serves no HTTP API.
      deploymentAnnotations:
        healthchecks.io/slug: authentik-worker

    # PostgreSQL Database Configuration
    postgresql:
      enabled: true
      auth:
        username: authentik #remediate
        database: authentik #remediate
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 25Gi
          accessModes:
            - ReadWriteOnce

    # # Redis Cache Configuration - should be deprecated and not required
    # redis:
    #   enabled: true
    #   auth:
    #     enabled: false
    #   master:
    #     persistence:
    #       enabled: true
    #       storageClass: longhorn
    #       size: 5Gi
