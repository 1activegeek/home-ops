---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  # The k8s range on the LAN is .51-.70. .51 is the Talos API VIP (not a
  # LoadBalancer), so the pool starts at .52. Never widen this to the whole
  # /24: Cilium would hand out static hosts' IPs (it once gave the NAS's
  # address to forgejo-ssh) and answer ARP for them.
  blocks:
    - start: "10.0.3.52"
      stop: "10.0.3.70"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
