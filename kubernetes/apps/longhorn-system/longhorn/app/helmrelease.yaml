---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 15m
  interval: 1h
  timeout: 15m
  values:
    # Set default data path for Longhorn storage
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn-data
      defaultReplicaCount: 2
      defaultDataLocality: best-effort
      allowRecurringJobWhileVolumeDetached: true
      snapshotDataIntegrity: enabled
      snapshotDataIntegrityImmediateCheckAfterSnapshotCreation: true
      fastReplicaRebuildEnabled: true
      # Cap concurrency so scheduled backups/restores never spike cluster load.
      backupConcurrentLimit: 2
      restoreConcurrentLimit: 2
      # Freeze the filesystem during snapshot for a more consistent point-in-time copy.
      freezeFilesystemForSnapshot: true
      # Live-upgrade every volume's engine to the default engine image, one engine
      # per node at a time, so old engine images drain and can be garbage-collected.
      # 0 disables automatic engine upgrades.
      # https://longhorn.io/docs/1.12.1/references/settings/#concurrent-automatic-engine-upgrade-per-node-limit
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      # The CNPG volumes (longhorn-cnpg) keep a single replica because Postgres
      # replicates itself. The default policy blocks a node drain on any last
      # replica, so Talos upgrades would stall; allow the drain once it is stopped.
      # https://longhorn.io/docs/1.12.1/maintenance/maintenance/
      nodeDrainPolicy: allow-if-replica-is-stopped

    # Off-cluster backup target: Synology NFS (NFSv4). No credentials needed for NFS.
    # In Longhorn v1.11 the backup target is the `defaultBackupStore` chart block
    # (it populates the `default` BackupTarget CR) — NOT defaultSettings.backupTarget,
    # which was removed as a setting in this version and is silently ignored.
    defaultBackupStore:
      backupTarget: nfs://10.0.3.2:/volume2/longhorn-backup
      backupTargetCredentialSecret: ""
      pollInterval: 300

    # Enable persistent storage
    persistence:
      defaultClass: true
      defaultFsType: ext4
      defaultClassReplicaCount: 2
      defaultDataLocality: best-effort
      reclaimPolicy: Delete
      volumeBindingMode: Immediate

    # Longhorn engine and manager settings
    longhornManager:
      priorityClass: system-cluster-critical

    longhornDriver:
      priorityClass: system-cluster-critical

    # UI service configuration (internal only)
    service:
      ui:
        type: ClusterIP

    # Ingress disabled - we'll use Gateway API HTTPRoute
    ingress:
      enabled: false
