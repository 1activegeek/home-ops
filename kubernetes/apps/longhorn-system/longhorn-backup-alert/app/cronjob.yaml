---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-backup-alert
spec:
  # Daily at 05:30 UTC — after the 03:00 daily + Sun 04:00 weekly Longhorn
  # recurring backups complete. Daily cadence keeps a persistent failure to one
  # alert/day rather than spamming.
  schedule: "30 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          # Selected by the `longhorn-manager-allow-metrics` NetworkPolicy in
          # kubernetes/apps/longhorn-system/longhorn/app/. Chart 1.12.1 locks
          # longhorn-manager:9500 down to longhorn's own pods, so without this
          # label the metrics read below times out and the job fails.
          labels:
            app.kubernetes.io/name: longhorn-backup-alert
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: curlimages/curl:8.21.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: METRICS_URL
                  value: "http://longhorn-backend.longhorn-system:9500/metrics"
                # Matrix delivery: matrix-media-relay posts into the
                # Infrastructure room as the @_webhooks_longhorn ghost, with the
                # Longhorn icon declared in the relay's avatar ConfigMap. `room`
                # is omitted deliberately -- the relay falls back to the only
                # room the longhorn profile owns, so the room ID stays declared
                # in one place (the relay HelmRelease) instead of two.
                - name: RELAY_URL
                  value: "http://matrix-media-relay.tools.svc.cluster.local:8080/notify"
                - name: RELAY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: longhorn-backup-alert-secret
                      key: RELAY_TOKEN
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Longhorn 1.11: longhorn_backup_state value 4 = Error.
                  # Line shape: longhorn_backup_state{backup="..",volume="..",recurring_job=".."} 4
                  BODY=$(curl -sf --max-time 20 "${METRICS_URL}")
                  FAILED=$(printf '%s\n' "${BODY}" | awk '/^longhorn_backup_state\{/ && $NF==4 {print}')
                  if [ -z "${FAILED}" ]; then
                    echo "[$(date -u)] OK — no Longhorn backups in Error state."
                    exit 0
                  fi
                  COUNT=$(printf '%s\n' "${FAILED}" | grep -c .)
                  VOLS=$(printf '%s\n' "${FAILED}" | sed -n 's/.*volume="\([^"]*\)".*/\1/p' | sort -u | tr '\n' ' ')
                  # Volume names are k8s-safe (lowercase alphanumerics + dashes),
                  # so no JSON escaping beyond the static text is required.
                  TXT="Longhorn backup failure: ${COUNT} backup(s) in Error state. Volume(s): ${VOLS}"
                  HTML="<b>Longhorn backup failure</b><br>${COUNT} backup(s) in Error state.<br><span data-mx-color=\"#888888\">Volume(s): ${VOLS}</span>"
                  echo "[$(date -u)] ${TXT}"
                  # Post to the Infrastructure room through matrix-media-relay.
                  # No `img`, so the relay sends a plain m.notice.
                  curl -sf --max-time 20 -X POST "${RELAY_URL}" \
                    -H "Authorization: Bearer ${RELAY_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "{\"text\":\"${TXT}\",\"html\":\"${HTML}\"}" >/dev/null
                  echo "[$(date -u)] Alert dispatched to Matrix #Infrastructure."
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
