---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-alert
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: longhorn-backup-alert-secret
  # Per-profile bearer token for matrix-media-relay. The profile -- not this
  # CronJob -- decides which ghost sends and which room it may reach, so a
  # leaked token cannot post as another sender or into an unrelated room.
  data:
    - secretKey: RELAY_TOKEN
      remoteRef:
        key: matrix-media-relay
        property: token_longhorn
