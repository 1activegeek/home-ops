---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret-dotenv.yaml
  - ./helmrelease.yaml
# The carried source patch lives as a real .diff under ./patches so it can be
# regenerated, reviewed and CI-tested as a file (see scripts/hermes-patch/ and
# ./patches/README.md) instead of being hand-maintained inside a YAML literal
# block. The name suffix hash is disabled because helmrelease.yaml mounts the
# ConfigMap by a fixed name; the controller's reloader.stakater.com/auto
# annotation is what rolls the pods when the diff changes.
configMapGenerator:
  - name: hermes-memory-patch
    files:
      - patches/27183-per-user-usermd.diff
generatorOptions:
  disableNameSuffixHash: true
