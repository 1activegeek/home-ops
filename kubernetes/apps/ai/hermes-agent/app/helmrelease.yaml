---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
spec:
  chartRef:
    kind: OCIRepository
    name: hermes-agent
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
        containers:
          gateway:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.18
            args: ["gateway", "run"]
            env:
              HERMES_HOME: /opt/data
              # The hermes CLI ships in the image venv (/opt/hermes/.venv/bin) but
              # that dir is not on the image's default PATH, so the agent's own
              # shell-outs to `hermes ...` fail with "hermes: not found". Prepend it.
              PATH: /opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PLAYWRIGHT_BROWSERS_PATH: /opt/data/.playwright
              PYTHONUNBUFFERED: "1"
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: "0.0.0.0"
              API_SERVER_PORT: "8642"
              # Multiplexed gateway (Quicksilver / v0.19.0, 2026-07-30): one
              # gateway process serves every profile under
              # /opt/data/profiles/<name>, instead of one gateway process per
              # profile. New profiles are added at runtime with
              # `hermes profile create <name>` and addressed with
              # `hermes -p <name> ...` — no extra container, port, or
              # HelmRelease change needed.
              #
              # Set as an env var rather than in config.yaml on the PVC:
              # gateway/config.py resolves this as env > config.yaml > default,
              # so this is an operator override that keeps the setting
              # declarative in git and immune to a Longhorn PVC rebuild. Only
              # "1/true/yes/on" and "0/false/no/off" are recognized; a blank
              # value is deliberately treated as unset (falls through to
              # config.yaml) rather than as false.
              #
              # Safe for the existing platform wiring: Mattermost (WebSocket)
              # and Matrix (/sync long-poll) are outbound-connecting adapters,
              # so the /p/<profile>/webhooks/<route> path change that
              # multiplexing introduces applies to no registered webhook here.
              # The default profile likewise keeps the unprefixed /v1/... API
              # listener on :8642 — only secondary profiles move to
              # /p/<profile>/v1/... — so open-webui's OPENAI_API_BASE_URL is
              # unaffected. Session keys do re-namespace to agent:<profile>:…
              # on the first multiplexed start.
              #
              # Adding a second profile later: it needs its own bot token per
              # platform (duplicate tokens hard-fail at startup) and, if it
              # exposes an API server, its own API_SERVER_PORT in
              # /opt/data/profiles/<name>/.env.
              GATEWAY_MULTIPLEX_PROFILES: "true"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 3Gi
          dashboard:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.18
            args: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure"]
            env:
              HERMES_HOME: /opt/data
              # Keep the hermes CLI on PATH here too (see gateway container note).
              PATH: /opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # v2026.7.x refuses to bind the dashboard to 0.0.0.0 unless an
              # auth provider is registered (--insecure no longer bypasses
              # this). Wired to Authentik via the bundled self_hosted OIDC
              # plugin — HERMES_DASHBOARD_OIDC_* vars ship in the mounted
              # /opt/data/.env (see externalsecret-dotenv.yaml and
              # kubernetes/apps/security/authentik/app/blueprints/hermes-oidc.yaml),
              # loaded into the process env by hermes's own dotenv handling —
              # same mechanism as MATRIX_* above.
            probes:
              # OIDC hardening (2026-07-19) made "/" redirect unauthenticated
              # requests to the Authentik login page (302), which kubelet's
              # httpGet probe treats as a failure ("Probe terminated
              # redirects") — the dashboard container was restarting on a
              # flapping liveness check. /favicon.ico is a static asset that
              # returns 200 without auth, so it's a safe unauthenticated
              # health check target instead.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /favicon.ico
                    port: 9119
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 9119
          api:
            port: 8642

    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /opt/data
      shared:
        type: nfs
        server: ${NFS_SERVER}
        path: "/volume1/syncthing/ic_documents/5 Shared/hermes"
        globalMounts:
          - path: /opt/data/shared

      hermes-dotenv:
        type: secret
        name: hermes-dotenv
        globalMounts:
          - path: /opt/data/.env
            subPath: .env
            readOnly: true

    route:
      app:
        hostnames: ["hermes.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: hermes-agent
                port: 9119
