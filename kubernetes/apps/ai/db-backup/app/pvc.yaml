---
# Used by db-backup-n8n (~0.5MiB/dump).
#
# 10Gi is a leftover from when qdrant snapshots (~300MiB each) shared this
# volume; qdrant has since been removed.
#
# `longhorn` supports online expansion (allowVolumeExpansion: true), so raising
# this value is applied in place — no pod restart or data loss. Shrinking is
# NOT supported: this number can only go up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
  labels:
    app.kubernetes.io/name: db-backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
