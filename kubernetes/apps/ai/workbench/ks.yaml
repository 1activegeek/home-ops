---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workbench
spec:
  dependsOn:
    - name: external-secrets
      namespace: security
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/ai/workbench/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
