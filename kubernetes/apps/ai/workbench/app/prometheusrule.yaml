---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workbench
spec:
  groups:
    - name: workbench
      rules:
        - alert: WorkbenchMemoryHigh
          expr: |
            max(container_memory_working_set_bytes{namespace="ai", container="app", pod=~"workbench-.*"})
              / max(kube_pod_container_resource_limits{namespace="ai", container="app", pod=~"workbench-.*", resource="memory"}) > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Workbench memory above 80% of its limit
            description: One runaway agent can OOM-kill the whole pod and every agent in it.
