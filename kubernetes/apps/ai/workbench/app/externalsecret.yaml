---
# One 1Password item ("workbench", homeops vault) holds every Workbench
# credential. Keys that don't exist yet render empty and the entrypoint skips
# them, so the pod boots before every credential is in place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workbench
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: workbench-secret
    template:
      data:
        op-sa-token: '{{ index . "op-sa-token" }}'
        github-ssh-key: '{{ index . "github-ssh-key" }}'
        forgejo-ssh-key: '{{ index . "forgejo-ssh-key" }}'
        ops-ssh-key: '{{ index . "ops-ssh-key" }}'
        gh-token: '{{ index . "gh-token" }}'
        accounts.yaml: '{{ index . "accounts-yaml" }}'
        ts_authkey: '{{ index . "ts-authkey" }}'
  dataFrom:
    - extract:
        key: workbench
