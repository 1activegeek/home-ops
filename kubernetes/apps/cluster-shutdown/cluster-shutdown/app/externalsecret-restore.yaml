---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-restore
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: cluster-restore-secret
    template:
      data:
        # Webhook of the HA automation "Power - Cluster Restored" (local_only).
        HA_WEBHOOK_URL: "http://home-assistant-app.home.svc.cluster.local:8123/api/webhook/{{ .ha_webhook_id }}"
  data:
    - secretKey: ha_webhook_id
      remoteRef:
        key: cluster-restore
        property: ha_webhook_id
