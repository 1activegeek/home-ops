---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-shutdown
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: cluster-shutdown-talosconfig
  # talosconfig whose client certificate carries only the os:operator role
  # (generated with `talosctl config new --roles os:operator`). It can shut
  # down and reboot nodes; it cannot read secrets, apply config or reset.
  data:
    - secretKey: talosconfig
      remoteRef:
        key: talos-operator-shutdown
        property: talosconfig
