---
# Identity the shutdown Job runs as: exactly what scripts/cluster-shutdown.sh
# needs to quiesce the cluster (suspend Flux + CronJobs, hibernate CNPG,
# scale workloads to zero, clear stuck pods, watch Longhorn detach).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-shutdown
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-shutdown
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-shutdown
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-shutdown
subjects:
  - kind: ServiceAccount
    name: cluster-shutdown
    namespace: cluster-shutdown
---
# Identity the cluster-restore CronJob runs as: what scripts/cluster-startup.sh
# and cluster-auto-restore.sh need (restore replicas, wake CNPG, resume CronJobs
# and Flux, request a reconcile, read node/platform health).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-restore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-restore
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "patch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-restore
subjects:
  - kind: ServiceAccount
    name: cluster-restore
    namespace: cluster-shutdown
---
# Home Assistant's "Shut down cluster" button: it may read the CronJob and
# create a Job from it — nothing else. The ValidatingAdmissionPolicy in
# admission-policy.yaml rejects any Job whose pod spec differs from the
# CronJob's, so this cannot be used to run arbitrary pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-assistant-trigger
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["cluster-shutdown"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-assistant-trigger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-assistant-trigger
subjects:
  - kind: ServiceAccount
    name: home-assistant
    namespace: home
