---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./cronjob.yaml
  - ./admission-policy.yaml
configMapGenerator:
  # The same break-glass script used from a workstation; one copy, two callers.
  - name: cluster-shutdown-script
    files:
      - cluster-shutdown.sh=../../../../../scripts/cluster-shutdown.sh
generatorOptions:
  disableNameSuffixHash: true
