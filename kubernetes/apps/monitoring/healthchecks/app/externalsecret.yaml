---
# Everything Healthchecks needs, from four 1Password items:
#   healthchecks  — app secrets, admin login, seeded API/ping keys (both
#                   projects), cloud ping URL
#   cnpg-postgres — the `healthchecks` role password (single source of truth;
#                   CNPG provisions the role from the same field)
#   SMTP Relay    — shared outbound mail relay (also used by Authentik)
#   matrix-media-relay — this app's relay token (owned by the relay item)
#
# The cnpg-postgres and SMTP Relay fields are cherry-picked with `data:` rather
# than extracted: all three items carry `username`/`password` fields, and
# merging whole items would let one silently overwrite another.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: healthchecks-secret
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
        DB_PASSWORD: "{{ .db_password }}"
        EMAIL_HOST: "{{ .smtp_host }}"
        EMAIL_PORT: "{{ .smtp_port }}"
        EMAIL_HOST_USER: "{{ .smtp_username }}"
        EMAIL_HOST_PASSWORD: "{{ .smtp_password }}"
        DEFAULT_FROM_EMAIL: "{{ .from_email }}"
        # Consumed by bootstrap.py (init container) and self-check.sh (CronJob).
        HC_ADMIN_EMAIL: "{{ .admin_email }}"
        HC_ADMIN_PASSWORD: "{{ .admin_password }}"
        HC_API_KEY: "{{ .api_key }}"
        HC_API_KEY_READONLY: "{{ .api_key_readonly }}"
        HC_PING_KEY: "{{ .ping_key }}"
        HC_CLOUD_PING_URL: "{{ .cloud_ping_url }}"
        # Second project ("Jobs": backups and scheduled scripts). bootstrap.py
        # seeds them; the heartbeat runner upserts/pings that project with them.
        HC_JOBS_API_KEY: "{{ .jobs_api_key }}"
        HC_JOBS_PING_KEY: "{{ .jobs_ping_key }}"
        # Bearer token for matrix-media-relay's `healthchecks` profile (bootstrap.py
        # writes it into the Matrix webhook integration).
        HC_MATRIX_RELAY_TOKEN: "{{ .matrix_relay_token }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: cnpg-postgres
        property: healthchecks_password
    - secretKey: smtp_host
      remoteRef:
        key: SMTP Relay
        property: SMTP Host
    - secretKey: smtp_port
      remoteRef:
        key: SMTP Relay
        property: SMTP Port
    - secretKey: smtp_username
      remoteRef:
        key: SMTP Relay
        property: username
    - secretKey: smtp_password
      remoteRef:
        key: SMTP Relay
        property: password
    - secretKey: matrix_relay_token
      remoteRef:
        key: matrix-media-relay
        property: token_healthchecks
  dataFrom:
    - extract:
        key: healthchecks
