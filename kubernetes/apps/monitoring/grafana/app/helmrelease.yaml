---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  chartRef:
    kind: OCIRepository
    name: grafana
  interval: 1h
  values:
    replicas: 1
    # Pinned explicitly (registry/repository/tag) so Renovate tracks each image.
    image:
      registry: docker.io
      repository: grafana/grafana
      tag: "13.2.4-distroless"
    deploymentStrategy:
      type: Recreate

    podAnnotations:
      reloader.stakater.com/auto: "true"

    admin:
      existingSecret: grafana-secret
      passwordKey: admin_password

    envFromSecret: grafana-secret

    grafana.ini:
      server:
        root_url: "https://grafana.${SECRET_DOMAIN}"
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      news:
        news_feed_enabled: false
      auth.generic_oauth:
        enabled: true
        name: Authentik
        allow_sign_up: true
        client_id: $__env{OIDC_CLIENT_ID}
        client_secret: $__env{OIDC_CLIENT_SECRET}
        scopes: openid email profile
        auth_url: https://auth.${SECRET_DOMAIN}/application/o/authorize/
        token_url: https://auth.${SECRET_DOMAIN}/application/o/token/
        api_url: https://auth.${SECRET_DOMAIN}/application/o/userinfo
        role_attribute_path: contains(groups[*], 'tier1') && 'Admin' || contains(groups[*], 'tier2') && 'Editor' || 'Viewer'
        role_attribute_strict: false

    initChownData:
      image:
        registry: docker.io
        repository: library/busybox
        tag: "1.38.0"

    persistence:
      enabled: true
      type: pvc
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      size: 1Gi

    sidecar:
      image:
        registry: quay.io
        repository: kiwigrid/k8s-sidecar
        tag: "2.14.1"
      dashboards:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
      datasources:
        enabled: true
        searchNamespace: ALL
