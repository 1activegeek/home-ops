---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml

# Gatus' own settings only (storage, UI, metrics, the few checks that have no
# route to hang an annotation on). Route checks are NOT listed here: the
# gatus-sidecar generates them from HTTPRoute/Gateway annotations. See
# docs/gatus.md.
configMapGenerator:
  - name: gatus-config
    files:
      - ./resources/config.yaml

generatorOptions:
  disableNameSuffixHash: true
