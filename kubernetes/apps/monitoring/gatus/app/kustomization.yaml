---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml

# Gatus' own settings only (storage, UI, metrics, the few checks that have no
# route to hang an annotation on). Route checks are NOT listed here: the
# gatus-sidecar generates them from HTTPRoute/Gateway annotations.
configMapGenerator:
  - name: gatus-config
    files:
      - ./resources/config.yaml
  # Grafana dashboard, auto-loaded by the Grafana sidecar (grafana_dashboard
  # label, any namespace). Substitution off: the JSON uses Grafana's own
  # $variables.
  - name: gatus-dashboard
    files:
      - gatus.json=./resources/dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

generatorOptions:
  disableNameSuffixHash: true
