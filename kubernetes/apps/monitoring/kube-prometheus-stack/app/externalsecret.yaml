---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: alertmanager-config
    template:
      # Delivery is a plain webhook_configs POST to matrix-hookshot, which
      # renders it with the `Alertmanager` connection's transformation function
      # and posts as @_webhooks_alertmanager. `alertmanager_url` is the
      # in-cluster /webhook/<hookId> URL (http, no external DNS/TLS dependency —
      # an alerting path must not depend on the things it alerts about).
      #
      # The hookId in that URL is the only credential a generic webhook has, so
      # it is stored concealed in 1P rather than written here. Rotating it means
      # a new connection: see docs/matrix-webhooks.md.
      #
      # webhook_configs, not slack_configs: hookshot reads only text/html/
      # username from a payload, so Slack's schema would land in the room as a
      # JSON code block.
      data:
        alertmanager.yaml: |
          route:
            group_by: ["alertname", "namespace"]
            group_wait: 1m
            group_interval: 10m
            repeat_interval: 12h
            receiver: matrix
            routes:
              - receiver: "null"
                matchers:
                  - alertname =~ "Watchdog|InfoInhibitor"
          receivers:
            - name: "null"
            - name: matrix
              webhook_configs:
                # max_alerts 0 = no truncation; the transformation function
                # renders one line per alert and hookshot trims oversize events
                # itself.
                - url: "{{ .alertmanager_url }}"
                  max_alerts: 0
                  send_resolved: true
          inhibit_rules:
            - source_matchers: ["severity = critical"]
              target_matchers: ["severity =~ warning|info"]
              equal: ["alertname", "namespace"]
            - source_matchers: ["severity = warning"]
              target_matchers: ["severity = info"]
              equal: ["alertname", "namespace"]
  dataFrom:
    - extract:
        key: hookshot-hooks
