---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: version-drift
spec:
  interval: 1h
  path: ./kubernetes/apps/monitoring/version-drift/app
  # NOTE: intentionally NO postBuild.substituteFrom: nothing here needs a
  # cluster variable, and the check script's ${VAR} expansions must survive.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
  wait: false
