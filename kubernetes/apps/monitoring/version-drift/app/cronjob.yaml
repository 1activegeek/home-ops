---
# Daily check that the cluster runs the Talos and Kubernetes versions Git asks
# for. Drift is tolerated for 7 days (time to schedule an upgrade after merging
# a version bump); after that the Job fails, and the Healthchecks heartbeat
# runner turns the failure into an alert on the "Jobs" project.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: version-drift
  annotations:
    healthchecks.io/slug: version-drift
spec:
  schedule: "15 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt: a retry would see the same versions, and a failure is the
      # alert signal.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: version-drift
        spec:
          serviceAccountName: version-drift
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/alpine/k8s:1.36.5
              command: ["bash", "/scripts/check.sh"]
              env:
                - name: HOME
                  value: /tmp
                - name: GRACE_DAYS
                  value: "7"
                - name: DESIRED_DIR
                  value: /desired
                - name: STATE_CONFIGMAP
                  value: version-drift-state
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: desired
                  mountPath: /desired
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: version-drift-script
            - name: desired
              configMap:
                name: version-drift-desired
            - name: tmp
              emptyDir: {}
