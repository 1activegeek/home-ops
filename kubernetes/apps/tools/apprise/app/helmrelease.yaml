---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apprise
spec:
  chartRef:
    kind: OCIRepository
    name: apprise
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: linuxserver/apprise-api
              tag: 1.5.4
            env:
              TZ: America/New_York
              PUID: "1027"
              PGID: "100"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8000

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 256Mi
        globalMounts:
          - path: /config

    # Two routes for one host; the longest path match wins, and ext_authz
    # attaches per route:
    #   app    -> apprise-app: web UI and every config/key endpoint (/, /cfg,
    #             /add, /get, /del, /json/urls, /details, /metrics, static).
    #             Behind Authentik forward-auth (internal-forward-auth
    #             component, see kustomization.yaml). /get and /json/urls
    #             return the stored notification URLs, i.e. the credentials.
    #   notify -> apprise-notify: only the send endpoints (POST /notify and
    #             /notify/<key>) and the plain "OK" health check, so senders
    #             keep working without an Authentik session. Apprise never
    #             reads X-authentik-* headers, so nothing to strip here.
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: Apprise
        hostnames: ["apprise.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: apprise
                port: 8000
      notify:
        annotations:
          # Apprise's own health check: plain-text "OK" when the config and
          # attachment stores are usable (the UI route only proves the
          # Authentik redirect).
          gatus.home-operations.com/endpoint: |
            name: Apprise API
            path: /status
            conditions:
              - "[STATUS] == 200"
              - "[BODY] == OK"
        hostnames: ["apprise.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path: { type: PathPrefix, value: /notify }
              - path: { type: Exact, value: /status }
            backendRefs:
              - name: apprise
                port: 8000
