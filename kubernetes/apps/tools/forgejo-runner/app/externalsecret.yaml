---
# Runner credential for the USER-SCOPED runner (owner's account, not
# instance-wide; security finding HRD-01).
#
# The token comes from the Forgejo API (POST /api/v1/user/actions/runners,
# called as the owner), which returns a uuid + token pair. The uuid is in
# configmap.yaml; the token lives in 1Password item `forgejo-runner`, field
# `runner_token`, and is mounted as a file the runner reads via `token_url`.
#
# The item's older `registration_token` field is the pre-shared secret of the
# retired instance-wide runner. It is no longer read here; it stays only so a
# revert of this change can bring the old runner back. Remove it once the
# instance-wide runner has been deleted in Forgejo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: forgejo-runner-secret
    template:
      data:
        # Mounted at /secrets/RUNNER_TOKEN; see server.connections in
        # configmap.yaml. Reloader restarts the pod when it changes.
        RUNNER_TOKEN: "{{ .runner_token }}"
  dataFrom:
    - extract:
        key: forgejo-runner
