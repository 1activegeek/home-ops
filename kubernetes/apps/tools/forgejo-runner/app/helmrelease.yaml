---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 1h
  values:
    controllers:
      forgejo-runner:
        replicas: 1
        # Recreate: two RWO PVCs (runner state + docker image store) cannot be
        # held by two pods at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # Native sidecar (restartPolicy: Always). Starts before the regular
          # containers and keeps running, so dockerd is guaranteed to be up and
          # listening before act_runner connects.
          dind:
            image:
              repository: docker.io/library/docker
              # PINNED TO 27.x DELIBERATELY — do not let Renovate walk this to 28+.
              # Docker 28 adopted os.Root-based archive extraction, which refuses
              # to traverse a symlink during CopyToContainer. act stages actions at
              # /var/run/act inside the job container, and /var/run is a symlink to
              # /run in Debian-based images (including the default
              # code.forgejo.org/oci/node:22-bookworm), so every `uses:` step died
              # with:
              #   statat var/run/act/actions/...: path escapes from parent
              # Re-evaluate when act_runner stages actions somewhere other than
              # /var/run, or upstream act works around the symlink.
              tag: 27.5.1-dind
            restartPolicy: Always
            # dockerd listens on a UNIX SOCKET ONLY — no TCP listener exists.
            #
            # dockerd-entrypoint.sh only appends its default `--host=tcp://...`
            # arguments when it is invoked with no arguments (`$# -eq 0`) or with
            # a leading flag. Passing `dockerd` explicitly skips that block, so
            # neither :2375 nor :2376 is ever opened. That removes the
            # unauthenticated-root-API-reachable-cluster-wide risk entirely,
            # which matters here because no NetworkPolicy is enforced anywhere.
            #
            # --group=1000 makes the socket group-owned by the runner's GID so
            # the unprivileged act_runner container can talk to it.
            command: ["dockerd"]
            args:
              - --host=unix:///var/run/docker/docker.sock
              - --group=1000
            env:
              DOCKER_HOST: unix:///var/run/docker/docker.sock
            securityContext:
              # dockerd genuinely requires this. No admission controller blocks
              # it (PodSecurity is disabled at the apiserver); precedent exists
              # in home-assistant and zwave-js-ui.
              privileged: true
              runAsUser: 0
              runAsGroup: 0
            probes:
              liveness: &dindprobe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *dindprobe
              # A native sidecar only guarantees dockerd has been STARTED before
              # the regular containers run — not that it is accepting
              # connections. A startupProbe is the one probe kubelet waits on
              # before starting dependent containers, so it closes that race
              # rather than relying on a crash and restart. A passing
              # `docker info` means the socket is live.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 5
                  periodSeconds: 3
                  timeoutSeconds: 10
                  failureThreshold: 40
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
                # Bounds a runaway build's writes to the node's EPHEMERAL
                # partition (capped 50-95GB with grow: false on these Talos
                # nodes). Image layers themselves live on the PVC below.
                ephemeral-storage: 2Gi

          register:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 12.13.2
            dependsOn: dind
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                if [ -f /data/.runner ]; then
                  echo "Runner already registered; nothing to do."
                  exit 0
                fi
                echo "Creating runner file for $${RUNNER_NAME} against $${FORGEJO_INSTANCE}"
                # create-runner-file, NOT `register`. `register` consumes the
                # one-shot registration token the web UI mints and fails against
                # a pre-shared secret with "runner registration token not found".
                # This subcommand is the counterpart to the server-side
                # `forgejo-cli actions register --secret`, which is what we use so
                # the runner's identity is reproducible from Git + 1Password.
                # --connect proves the secret is accepted before the daemon starts.
                /bin/forgejo-runner create-runner-file \
                  --config /config/config.yaml \
                  --instance "$${FORGEJO_INSTANCE}" \
                  --secret "$${RUNNER_SECRET}" \
                  --name "$${RUNNER_NAME}" \
                  --connect
            env:
              # Shell variables above are escaped $${VAR}: this Kustomization
              # declares postBuild.substituteFrom, so a bare ${VAR} would be
              # replaced by Flux with an empty string before the pod ever runs.
              # ${SECRET_DOMAIN} below is intentionally UNescaped — that one
              # Flux *should* substitute.
              FORGEJO_INSTANCE: "https://git.${SECRET_DOMAIN}"
              RUNNER_NAME: k8s-runner-1
              # A pre-shared secret, not a registration token — the two are
              # consumed by different subcommands. Named accordingly.
              RUNNER_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-secret
                    key: RUNNER_SECRET
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

        containers:
          app:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 12.13.2
            command:
              ["/bin/forgejo-runner", "daemon", "--config", "/config/config.yaml"]
            env:
              # Shared emptyDir socket from the dind sidecar. No TLS material is
              # needed because there is no TCP listener to protect.
              DOCKER_HOST: unix:///var/run/docker/docker.sock
              TZ: America/Denver
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "test -f /data/.runner"]
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  failureThreshold: 3
              readiness:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
                ephemeral-storage: 2Gi

          # Keeps the docker image store from growing without bound. Without
          # this the 50Gi PVC below fills and every build starts failing.
          prune:
            image:
              repository: docker.io/library/docker
              # Kept in step with the dind daemon above.
              tag: 27.5.1-cli
            command: ["/bin/sh", "-c"]
            args:
              - |
                while true; do
                  sleep 86400
                  docker system prune -af --filter "until=168h" || true
                  docker builder prune -af --filter "until=168h" || true
                done
            env:
              DOCKER_HOST: unix:///var/run/docker/docker.sock
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

        pod:
          securityContext:
            # Matches the runner image's built-in 1000:1000 user. The dind
            # sidecar overrides this to root above.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    persistence:
      # Runner registration state (.runner), act cache, host-mode workdir.
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          forgejo-runner:
            register:
              - path: /data
            app:
              - path: /data

      # Docker image layers and build cache.
      #
      # This MUST be a PVC, not an emptyDir. The Talos nodes cap their EPHEMERAL
      # partition at 50-95GB with grow: false, so image layers on an emptyDir
      # would push kubelet into DiskPressure and evict every workload on a node
      # that is also a control-plane node. longhorn-nobackup because layers are
      # 100% rebuildable and must not consume NAS backup capacity.
      dind-storage:
        type: persistentVolumeClaim
        storageClass: longhorn-nobackup
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          forgejo-runner:
            dind:
              - path: /var/lib/docker

      # dockerd's UNIX socket, shared between the sidecar and its clients.
      #
      # act_runner bind-mounts this socket into every job container (at
      # /var/run/docker.sock) because container.docker_host names it. That is
      # what lets workflows build and push images. It grants a job root inside
      # the dind sandbox — which is inherent to letting CI use Docker at all —
      # but NOT on the node: this is our own dockerd, not a node socket. Talos
      # runs containerd and has no docker socket to expose.
      docker-sock:
        type: emptyDir
        advancedMounts:
          forgejo-runner:
            dind:
              - path: /var/run/docker
            app:
              - path: /var/run/docker
            prune:
              - path: /var/run/docker

      config:
        type: configMap
        name: forgejo-runner-config
        advancedMounts:
          forgejo-runner:
            register:
              - path: /config
                readOnly: true
            app:
              - path: /config
                readOnly: true

      # Job working directories. emptyDir is correct here — short-lived, and
      # bounded by the ephemeral-storage limits above.
      workspace:
        type: emptyDir
        advancedMounts:
          forgejo-runner:
            app:
              - path: /workspace

    # No service and no route: the runner only makes outbound connections to
    # Forgejo. Nothing needs to reach it.
