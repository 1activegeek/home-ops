---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner
spec:
  dependsOn:
    # The runner connects to Forgejo through server.connections (user-scoped
    # credential from 1Password); there is no register init container any more.
    - name: forgejo
    - name: external-secrets
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/tools/forgejo-runner/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
