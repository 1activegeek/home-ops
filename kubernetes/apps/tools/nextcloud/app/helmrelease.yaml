---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  chartRef:
    kind: OCIRepository
    name: nextcloud
  interval: 1h
  values:
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The NAS share only accepts writes from UID 1027 (Synology ACLs ignore POSIX modes), so
          # the whole pod runs as that user instead of the image's www-data (33). Apache binds :80
          # as non-root through the unprivileged-port sysctl.
          securityContext:
            runAsUser: 1027
            runAsGroup: 100
            sysctls:
              - name: net.ipv4.ip_unprivileged_port_start
                value: "0"
        initContainers:
          # Root, so it can hand the app volume (first created as www-data) to 1027 and seed a
          # writable PHP conf.d: the entrypoint writes redis-session.ini there on every start.
          init-perms:
            image: &image
              repository: nextcloud
              tag: 34.0.4
            command:
              - sh
              - -c
              - >-
                cp -a /usr/local/etc/php/conf.d/. /php-conf/ &&
                chown -R 1027:100 /php-conf &&
                find /var/www/html \( ! -user 1027 -o ! -group 100 \) -exec chown -h 1027:100 {} +
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image: *image
            env: &env
              POSTGRES_HOST: nextcloud-postgres
              POSTGRES_DB: nextcloud
              POSTGRES_USER: nextcloud
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: db_password
              REDIS_HOST: nextcloud-redis
              REDIS_HOST_PORT: "6379"
              NEXTCLOUD_ADMIN_USER:
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: admin_user
              NEXTCLOUD_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: admin_password
              NEXTCLOUD_DATA_DIR: /mnt/nextcloud/data
              NEXTCLOUD_DOMAIN: "cloud.${SECRET_DOMAIN}"
              NEXTCLOUD_PHONE_REGION: US
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: oidc_client_id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: oidc_client_secret
              OIDC_DISCOVERY_URI: "https://auth.${SECRET_DOMAIN}/application/o/nextcloud/.well-known/openid-configuration"
              TRUSTED_PROXIES: 10.0.0.0/8
              OVERWRITEPROTOCOL: https
              OVERWRITECLIURL: "https://cloud.${SECRET_DOMAIN}"
              PHP_MEMORY_LIMIT: 512M
              PHP_UPLOAD_LIMIT: 16G
            probes:
              # The setup hook runs before Apache starts; a first install on NFS takes minutes.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &statusProbe
                    path: /status.php
                    port: 80
                    # Once installed, Nextcloud answers 400 to hosts outside trusted_domains,
                    # and the kubelet would otherwise send the pod IP.
                    httpHeaders:
                      - name: Host
                        value: "cloud.${SECRET_DOMAIN}"
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *statusProbe
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *statusProbe
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          # Background jobs must run through the CLI: cron.php over HTTP runs a single job per
          # request. A sidecar shares the RWO app volume, which a separate CronJob pod cannot.
          cron:
            image: *image
            command:
              - sh
              - -c
              - while true; do php -f /var/www/html/cron.php; sleep 300; done
            env: *env
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi

      postgres:
        containers:
          postgres:
            image:
              repository: postgres
              tag: 18-alpine
            env:
              POSTGRES_DB: nextcloud
              POSTGRES_USER: nextcloud
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: db_password
              PGDATA: /var/lib/postgresql/data/pgdata
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999

      redis:
        containers:
          redis:
            image:
              repository: redis
              tag: 8-alpine
            args:
              - redis-server
              - --save
              - "60"
              - "1"
              - --loglevel
              - warning
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
      redis:
        controller: redis
        ports:
          redis:
            port: 6379

    persistence:
      app:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          main:
            init-perms:
              - path: /var/www/html
            app:
              - path: /var/www/html
            cron:
              - path: /var/www/html
      # Mounted outside the web root; Nextcloud keeps its data in a data/ subdirectory it owns,
      # since the share root belongs to the NAS.
      data:
        type: nfs
        server: ${NFS_SERVER}
        path: /volume1/nextcloud
        advancedMounts:
          main:
            app:
              - path: /mnt/nextcloud
            cron:
              - path: /mnt/nextcloud
      php-conf:
        type: emptyDir
        advancedMounts:
          main:
            init-perms:
              - path: /php-conf
            app:
              - path: /usr/local/etc/php/conf.d
            cron:
              - path: /usr/local/etc/php/conf.d
      hooks:
        type: configMap
        name: nextcloud-hooks
        defaultMode: 0555
        advancedMounts:
          main:
            app:
              - path: /docker-entrypoint-hooks.d/before-starting
                readOnly: true
      postgres-data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          postgres:
            postgres:
              - path: /var/lib/postgresql/data

    route:
      app:
        hostnames: ["cloud.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: nextcloud-main
                port: 80
