---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml

# The relay is stdlib-only Python mounted into a stock python image, so there is
# no image to build or registry to publish to. disableNameSuffixHash keeps the
# name stable for the helmrelease reference; reloader restarts the pod on change.
configMapGenerator:
  - name: matrix-media-relay-src
    files:
      - relay.py
  # Ghost avatars. kustomize puts the PNG in binaryData automatically. Keeping
  # them in git makes the avatars reproducible after a homeserver rebuild -- the
  # relay re-uploads and re-applies them, rather than the icon being one-off
  # manual state nothing records. avatar-plex.svg is the editable source.
  - name: matrix-media-relay-avatars
    files:
      - avatar-plex.png
      - avatar-requests.png
      - avatar-uptimekuma.png
      - avatar-longhorn.png
      - avatar-cloudflare.png

generatorOptions:
  disableNameSuffixHash: true
