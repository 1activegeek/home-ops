---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-media-relay
spec:
  chartRef:
    kind: OCIRepository
    name: matrix-media-relay
  interval: 1h
  values:
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim
            command: ["python", "-u", "/app/relay.py"]
            env:
              TZ: America/New_York
              PORT: &port 8080
              SYNAPSE_URL: http://synapse-main.tools.svc.cluster.local:8008
              TAUTULLI_URL: http://tautulli.media.svc.cluster.local:8181
              # Absolute `img` URLs are fetched only from these hosts. Seerr
              # hands out TMDB poster links; Tautulli's Plex library paths are
              # relative and still go through the Tautulli API instead.
              IMAGE_HOSTS: image.tmdb.org
              # Routing table. The profile -- not the request -- decides which
              # ghost sends and which rooms are reachable, so a leaked token is
              # confined to one sender and one room set. Each profile needs a
              # matching TOKEN_<NAME> in the ExternalSecret; one without a token
              # is logged and skipped at startup.
              #
              # To add a source: add a profile here and add its TOKEN_<NAME>.
              # The ghost registers and joins its rooms on first use, so a
              # public room needs nothing further; an invite-only room still
              # needs the ghost invited, since a join cannot manufacture an
              # invite. Any new sender must stay inside hookshot's exclusive
              # @_webhooks_* namespace -- a different prefix would need its own
              # appservice registration and a Synapse restart.
              PROFILES: |
                {
                  "plex": {
                    "sender": "@_webhooks_plex:matrix.${SECRET_DOMAIN}",
                    "rooms": ["!oczWlBAHrRRoVjTndB:matrix.${SECRET_DOMAIN}"],
                    "displayname": "Plex",
                    "avatar": "avatar-plex.png"
                  },
                  "requests": {
                    "sender": "@_webhooks_requests:matrix.${SECRET_DOMAIN}",
                    "rooms": ["!oczWlBAHrRRoVjTndB:matrix.${SECRET_DOMAIN}"],
                    "displayname": "Requests",
                    "avatar": "avatar-requests.png"
                  }
                }
            envFrom:
              - secretRef:
                  name: matrix-media-relay-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      src:
        type: configMap
        name: matrix-media-relay-src
        advancedMounts:
          main:
            app:
              - path: /app/relay.py
                subPath: relay.py
                readOnly: true
      # Ghost avatars, referenced by "avatar" in PROFILES above. Without this
      # mount the relay logs that the file is unreadable and skips applying the
      # avatar -- notifications still send, so the omission is quiet.
      avatars:
        type: configMap
        name: matrix-media-relay-avatars
        advancedMounts:
          main:
            app:
              - path: /app/avatars/avatar-plex.png
                subPath: avatar-plex.png
                readOnly: true
              - path: /app/avatars/avatar-requests.png
                subPath: avatar-requests.png
                readOnly: true

    # Internal only. Tautulli reaches it in-cluster; the route is for testing.
    route:
      app:
        hostnames: ["matrix-media-relay.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: matrix-media-relay
                port: *port
