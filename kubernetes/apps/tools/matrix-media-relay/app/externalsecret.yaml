---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-media-relay
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: matrix-media-relay-secret
  # Pulled from the owning items rather than copied into a new one, so rotating
  # hookshot's or tautulli's credentials propagates here with no second edit.
  data:
    # Hookshot's appservice token. Synapse lets an AS token masquerade as any
    # user in its exclusive namespace, so the relay posts as the same
    # @_webhooks_* ghost hookshot uses -- no second appservice registration,
    # and no Synapse restart.
    - secretKey: AS_TOKEN
      remoteRef:
        key: hookshot
        property: as_token
    # Tautulli's /pms_image_proxy requires a web session; only the /api/v2
    # command form accepts an API key, which is what the relay calls.
    - secretKey: TAUTULLI_API_KEY
      remoteRef:
        key: tautulli
        property: api_key
    # Per-profile bearer tokens, named TOKEN_<PROFILE> to match the PROFILES
    # table in the HelmRelease. Scoping is per token: the Plex token can only
    # post as the Plex ghost, into the Plex room. Add one property per new
    # source rather than sharing a single secret across all of them.
    - secretKey: TOKEN_PLEX
      remoteRef:
        key: matrix-media-relay
        property: token_plex
    - secretKey: TOKEN_REQUESTS
      remoteRef:
        key: matrix-media-relay
        property: token_requests
    # Infrastructure room senders. The two CronJobs build their own payload,
    # so neither needs a hookshot transformation function -- which is also
    # what keeps their ghosts free of hookshot's "(Webhook)" display-name
    # suffix. (Uptime checks no longer post here directly: Gatus alerts go
    # through Alertmanager.)
    - secretKey: TOKEN_LONGHORN
      remoteRef:
        key: matrix-media-relay
        property: token_longhorn
    - secretKey: TOKEN_CLOUDFLARE
      remoteRef:
        key: matrix-media-relay
        property: token_cloudflare
    # Self-hosted Healthchecks (monitoring/healthchecks). Its webhook channel
    # posts structured placeholders and the relay renders the card
    # (render_healthchecks), because Healthchecks cannot HTML-escape a check name.
    - secretKey: TOKEN_HEALTHCHECKS
      remoteRef:
        key: matrix-media-relay
        property: token_healthchecks
    # Home Assistant's own alerts (automation/script errors, dead Z-Wave
    # nodes): a rest_command in HA's packages/infra_alerts.yaml posts structured
    # fields and the relay renders the card (render_homeassistant). HA reads the
    # same token from its secrets.yaml (matrix_relay_homeassistant_auth).
    - secretKey: TOKEN_HOMEASSISTANT
      remoteRef:
        key: matrix-media-relay
        property: token_homeassistant
