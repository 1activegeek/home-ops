---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homarr
spec:
  dependsOn:
    # Homarr runs its migrations against CNPG on startup. The postgres
    # Kustomization waits on the CNPG Cluster reporting a healthy phase, and it
    # also owns the homarr role and Database CR.
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/tools/homarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
