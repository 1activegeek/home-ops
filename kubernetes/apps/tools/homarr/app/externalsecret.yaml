---
# Everything Homarr needs, from two 1Password items:
#   homarr        — encryption key, OIDC client (shared with authentik's
#                   authentik-oidc-clients), break-glass local admin
#   cnpg-postgres — the `homarr` role password (single source of truth; CNPG
#                   provisions the role from the same field)
#
# The role password is cherry-picked with `data:` because both items carry a
# `password` field and merging whole items would let one overwrite the other.
#
# Key names are what the official chart's envSecrets block reads. The
# break-glass keys are not mounted into the pod; they are here so the login
# survives a 1Password outage via `kubectl get secret`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: homarr-secret
    template:
      data:
        db-url: "postgresql://homarr:{{ .db_password }}@postgres-rw.database.svc.cluster.local:5432/homarr"
        db-encryption-key: "{{ .db_encryption_key }}"
        oidc-client-id: "{{ .oidc_client_id }}"
        oidc-client-secret: "{{ .oidc_client_secret }}"
        breakglass-username: "{{ .admin_username }}"
        breakglass-password: "{{ .admin_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: cnpg-postgres
        property: homarr_password
  dataFrom:
    - extract:
        key: homarr
