cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    # PodSecurity admission restored (previously deleted). enforce is
    # "privileged" so nothing is rejected; warn/audit at "baseline" surface
    # non-compliant workloads in kubectl warnings and the audit log so
    # namespaces can be labelled and enforce tightened later.
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1
          kind: PodSecurityConfiguration
          defaults:
            enforce: privileged
            enforce-version: latest
            warn: baseline
            warn-version: latest
            audit: baseline
            audit-version: latest
          # exemptions: not set here — this entry merges (by name) with the
          # Talos default PodSecurity config, which already exempts kube-system;
          # listing it again would duplicate the entry.
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
      # Reduce per-resource watch cache from default 100 to 50 — homelab scale doesn't need full cache
      default-watch-cache-size: "50"
      # OIDC trust for Authentik (enables Headlamp SSO — the id_token Headlamp
      # forwards is validated by the apiserver against this issuer). Additive:
      # existing admin client-cert / static kubeconfig auth is unaffected.
      # NOTE: applied out-of-band via `talosctl apply-config` (not Flux).
      oidc-issuer-url: https://auth.${SECRET_DOMAIN}/application/o/headlamp/
      oidc-client-id: WxrKDa2ZRlFrT52GxJVz6wJuQxRSDw7RIAicrGP9
      oidc-username-claim: email
      oidc-groups-claim: groups
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.0.3.0/24
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
machine:
  features:
    # Lets pods in the tools namespace (db-backup jobs) obtain a Talos API client cert
    # (via a talos.dev/v1alpha1 ServiceAccount) limited to etcd snapshots.
    # NOTE: deprecated in Talos 1.14 in favour of the KubeTalosAPIAccessConfig
    # document, but still supported; migrate together with the rest of the
    # v1alpha1 config.
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - tools
