---
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  # Prefer the upstream template's repo-root ./age.key when someone has actually
  # put one there; otherwise fall back to the XDG path .sops.yaml declares as
  # key_file, which is where this cluster's key really lives. Hardcoding the
  # repo-root path broke every task guarded by `test -f '{{.SOPS_AGE_KEY_FILE}}'`.
  SOPS_AGE_KEY_FILE:
    sh: 'if [ -f "{{.ROOT_DIR}}/age.key" ]; then echo "{{.ROOT_DIR}}/age.key"; else echo "$HOME/.config/sops/age/home-ops.key"; fi'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos
  validate: .taskfiles/validate
  db-migrations: .taskfiles/db-migrations

tasks:

  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  validate:
    desc: Run all validation checks (static + flux-local + integration pre-flight)
    cmds:
      - task: validate:all

  validate-security:
    desc: Classify every route into the 4 route classes and validate auth posture
    cmd: python3 "{{.ROOT_DIR}}/.taskfiles/kubernetes/scripts/validate-route-classes.py"
